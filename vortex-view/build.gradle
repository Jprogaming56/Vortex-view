plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

group = mod_group
version = mod_version
base.archivesName = 'vortex-view'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
        }
        client {
            property 'mixin.env.remapRefMap', 'true'
        }
    }
}

repositories {
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // Nothing from AiT is needed at compile time: the add-on talks to AiT through reflection,
    // so the build does not need the AiT jar.
}

tasks.named('jar') {
    manifest {
        attributes([
            'Specification-Title'   : 'Vortex View',
            'Specification-Version' : '1',
            'Implementation-Title'  : 'vortex-view',
            'Implementation-Version': project.version
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
